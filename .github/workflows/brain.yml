name: Brain

on:
  pull_request:
    paths:
      - workers/brain/**
      - instructions/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/brain.yml
  push:
    branches: [main]
    paths:
      - workers/brain/**
      - instructions/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/brain.yml

permissions:
  contents: read

defaults:
  run:
    working-directory: workers/brain

concurrency:
  group: brain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck and test
    runs-on: ubuntu-latest
    steps:
      - uses: build40for40/actions/setup@v1
      - run: pnpm typecheck
      - run: pnpm test
