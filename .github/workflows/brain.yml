name: Brain

on:
  pull_request:
    paths:
      - workers/brain/**
      - instructions/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/brain.yml
  push:
    branches: [main]
    paths:
      - workers/brain/**
      - instructions/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/brain.yml

permissions:
  contents: read

defaults:
  run:
    working-directory: workers/brain

concurrency:
  group: brain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
