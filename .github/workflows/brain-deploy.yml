name: Brain deploy

on:
  push:
    branches: [main]
    paths:
      - workers/brain/**
      - instructions/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/brain-deploy.yml
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: workers/brain

concurrency:
  group: brain-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to build40for40.com/day13/api
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      WORKOS_API_KEY: ${{ secrets.WORKOS_API_KEY }}
    steps:
      - uses: build40for40/actions/setup@v1
        id: setup
      - run: pnpm typecheck
      - run: pnpm test
      - uses: build40for40/actions/deploy-worker@v1
        with:
          api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          working-directory: workers/brain
          package-manager: ${{ steps.setup.outputs.package-manager }}
          secrets: |
            ANTHROPIC_API_KEY
            WORKOS_API_KEY
