name: Web deploy

on:
  push:
    branches: [main]
    paths:
      - apps/web/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/web-deploy.yml
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/web

concurrency:
  group: web-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to build40for40.com/dumpling
    runs-on: ubuntu-latest
    steps:
      - uses: build40for40/actions/setup@v1
        id: setup
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - uses: build40for40/actions/deploy-worker@v1
        with:
          api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          working-directory: apps/web
          package-manager: ${{ steps.setup.outputs.package-manager }}
