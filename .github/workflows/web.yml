name: Web

on:
  pull_request:
    paths:
      - apps/web/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/web.yml
  push:
    branches: [main]
    paths:
      - apps/web/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/web.yml

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/web

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, test, build and preview
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: build40for40/actions/setup@v1
        id: setup
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - uses: build40for40/actions/preview-worker@v1
        with:
          api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          working-directory: apps/web
          package-manager: ${{ steps.setup.outputs.package-manager }}
          path: /dumpling/
