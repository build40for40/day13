<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Dumpling</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,500&family=Inter:wght@400;500;600&display=swap">
<style>
[hidden] { display: none !important }
/* Layout: a thin pool on top as the trust layer. Then Today, then Tomorrow. Future is its own tab. Dumpling colours show urgency; shapes identify each part of life. A soft sky-blue and teal backdrop keeps the task space calm. */
:root { color-scheme: light; --water: #93c2cb; --deep: #c1dfed; --card: rgba(245, 252, 253, .78); --foam: #214758; --mute: #486a7a; --line: rgba(49, 99, 118, .18); --gold: #ffd36b; --font: 'Inter', system-ui, sans-serif; --serif: 'Fraunces', Georgia, serif }
* { box-sizing: border-box }
html, body { height: 100% }
body { margin: 0; background: var(--water); color: var(--foam); font-family: var(--font); overflow: hidden }
.phone { height: 100%; max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; background: radial-gradient(ellipse at 8% 4%, rgba(255,255,255,.56), transparent 48%), linear-gradient(165deg, var(--deep), #acd4df 45%, var(--water)) }
.pad { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
#pool { position: relative; flex: none; height: clamp(150px, 20vh, 200px); margin-top: env(safe-area-inset-top, 0px) }
canvas { touch-action: none; cursor: grab; position: absolute; inset: 0; width: 100%; height: 100% }
.seg { display: flex; gap: 4px; padding-block: 8px 4px }
.seg button { flex: 1; border: 1px solid var(--line); background: transparent; color: var(--mute); border-radius: 999px; padding: 9px 0; font: 500 14px var(--font); cursor: pointer }
.seg button[aria-pressed=true] { background: #f1fafc; color: var(--foam); border-color: rgba(255,255,255,.7) }
.filters { display: flex; flex-wrap: wrap; gap: 6px; padding-top: 10px; padding-bottom: 2px }
.filters button { border: 1px solid var(--line); border-radius: 999px; padding: 7px 11px; background: rgba(245,252,253,.35); color: var(--foam); font: 500 12px var(--font); cursor: pointer; min-height: 34px }
.filters button[aria-pressed=true] { background: var(--foam); border-color: var(--foam); color: #f1fafc }
button.category { cursor: pointer }
button.category:hover { background: color-mix(in srgb, var(--category) 16%, white) }
.scroll { flex: 1; min-height: 0; overflow-y: auto; padding-bottom: 24px }
h2 { font: 600 28px/1.15 var(--font); letter-spacing: -.02em; margin: 22px 0 0; display: flex; align-items: baseline; gap: 10px }
h2 small { font: 400 14px var(--font); color: var(--mute) }
.stack { display: flex; flex-direction: column; gap: 10px; margin-top: 14px }
.card { display: flex; align-items: center; gap: 14px; background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 15px 14px 15px 20px; box-shadow: 0 4px 16px rgba(51, 101, 125, .045); transition: background .2s }
.card.hl, .up.hl { background: #e2f4f8 }
.txt { flex: 1; min-width: 0 }
.short { font-size: 20px; font-weight: 600; line-height: 1.15; letter-spacing: -.01em }
.category { display: inline-flex; align-items: center; gap: 5px; width: fit-content; margin-top: 7px; padding: 3px 8px; border: 1px solid color-mix(in srgb, var(--category) 22%, transparent); border-radius: 999px; background: color-mix(in srgb, var(--category) 8%, white); color: var(--category); font: 500 11px/1.2 var(--font); white-space: nowrap }
.category::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: currentColor }
.up .category { margin-top: 5px }
.why { margin-top: 3px; font-size: 13px; color: var(--mute) }
.tick { flex: none; width: 62px; height: 42px; border: 0; background: none; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent }
.tick svg { width: 100%; height: 100%; overflow: visible; display: block }
.tick .o { fill: transparent; stroke: var(--c); stroke-width: 5; stroke-linejoin: round; transition: fill .2s }
.tick .x { fill: none; stroke: var(--c); stroke-width: 4 }
.tick .pl { fill: none; stroke: var(--c); stroke-width: 3.5; stroke-linecap: round; opacity: .85 }
.tick:hover .o, .tick:active .o { fill: color-mix(in srgb, var(--c) 30%, transparent) }
.tick .bite { fill: var(--card); transform-box: fill-box; transform-origin: center; transform: scale(0) }
.tick .puff circle { fill: rgba(217, 243, 238, .75); opacity: 0; transform-box: fill-box; transform-origin: center }
.tick.eating { pointer-events: none }
.tick.eating .o { fill: var(--c); stroke: var(--c) }
.tick.eating .x { fill: rgba(255, 255, 255, .35) }
.tick.eating .pl { stroke: rgba(255, 255, 255, .8) }
.tick.eating .bite { animation: bite .3s .1s ease-out forwards }
.tick.eating .puff circle { animation: puff .8s .15s ease-out forwards }
.tick.eating .puff circle:nth-child(2) { animation-delay: .3s } .tick.eating .puff circle:nth-child(3) { animation-delay: .45s }
.eaten { animation: away .45s .55s ease-in forwards }
@keyframes bite { to { transform: scale(1) } }
@keyframes puff { 0% { opacity: .85; transform: translateY(0) scale(.6) } 100% { opacity: 0; transform: translateY(-28px) scale(1.5) } }
@keyframes away { to { opacity: 0; transform: translateX(26px) scale(.96) } }
.card.fresh { animation: wobble .7s ease }
@keyframes wobble { 0% { transform: scale(.9) rotate(-2deg); opacity: 0 } 40% { transform: scale(1.03) rotate(1.5deg); opacity: 1 } 70% { transform: rotate(-1deg) } 100% { transform: none } }
@media (prefers-reduced-motion: reduce) { .tick.eating .bite, .tick.eating .puff circle, .eaten, .card.fresh { animation: none } .tick.eating .bite { transform: scale(1) } .eaten { opacity: 0 } }
.group { flex-direction: column; align-items: stretch; gap: 2px; background: radial-gradient(120% 140% at 0% 0%, color-mix(in srgb, var(--c) 24%, transparent), transparent 65%), var(--card) }
.gh { padding-bottom: 6px; font: italic 500 17px var(--serif) }
.sub-row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line) }
.who { font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: #06141a; background: var(--c); border-radius: 999px; padding: 2px 8px; flex: none }
.sub-row .short { font-size: 17px }
.empty { color: var(--mute); font-size: 16px; margin: 14px 0 0 }
.up { display: flex; align-items: center; gap: 12px; padding: 13px 8px; border-bottom: 1px solid var(--line); border-radius: 10px; font-size: 16px }
.up i { width: 10px; height: 10px; border-radius: 50%; background: var(--c); flex: none }
.up .n { flex: 1; min-width: 0 }
.up .d { color: var(--mute); font-size: 13px; font-variant-numeric: tabular-nums }
.label { font-size: 12px; font-weight: 500; letter-spacing: .1em; text-transform: uppercase; color: var(--mute); margin: 26px 0 4px }
.donebtn { display: flex; justify-content: space-between; width: 100%; background: none; border: 0; color: var(--mute); font: 500 13px var(--font); padding: 0; margin-top: 30px; cursor: pointer }
.done-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; color: var(--mute); font-size: 15px }
.done-row span { flex: 1; text-decoration: line-through }
.link { background: transparent; border: 0; color: var(--mute); font: 500 12px var(--font); text-decoration: underline; cursor: pointer; padding: 4px 0 }
.bar { flex: none; padding-top: 10px; padding-bottom: max(12px, env(safe-area-inset-bottom, 0px)); background: rgba(188, 220, 230, .94); border-top: 1px solid var(--line) }
.bar form { display: flex; gap: 8px; align-items: center; background: rgba(247, 253, 255, .74); border: 1px solid var(--line); border-radius: 999px; padding: 6px 6px 6px 18px }
.bar input { flex: 1; min-width: 0; background: transparent; border: 0; color: var(--foam); font: 16px var(--font); outline: none; padding: 8px 0 }
.bar input::placeholder { color: var(--mute) }
.mic { flex: none; width: 48px; height: 48px; border-radius: 50%; border: 0; background: #eaf8fc; color: var(--foam); display: grid; place-items: center; cursor: pointer }
.mic svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round }
/* A slow, soft yellow glow: the mic is the main way in. */
.mic { box-shadow: 0 0 0 1px rgba(255, 211, 107, .35), 0 0 14px rgba(255, 211, 107, .28), 0 0 32px rgba(255, 211, 107, .14); animation: glow 3.6s ease-in-out infinite }
@keyframes glow { 50% { box-shadow: 0 0 0 1px rgba(255, 211, 107, .5), 0 0 20px rgba(255, 211, 107, .42), 0 0 42px rgba(255, 211, 107, .22) } }
.mic .arrow { display: none }
.mic.send .arrow { display: block }
.mic.send .mk { display: none }
.mic.send { animation: none; box-shadow: none }
.mic.listening { background: var(--gold); animation: listen 1.1s ease-in-out infinite }
@keyframes listen { 0%, 100% { box-shadow: 0 0 0 0 rgba(255, 211, 107, .55) } 50% { box-shadow: 0 0 0 14px rgba(255, 211, 107, 0) } }
@media (prefers-reduced-motion: reduce) { .mic, .mic.listening { animation: none } }
.toast { position: fixed; left: 16px; right: 16px; bottom: calc(90px + env(safe-area-inset-bottom, 0px)); max-width: 488px; margin: 0 auto; background: #f0fafc; color: var(--foam); border-radius: 14px; padding: 12px 14px; font-size: 14px; font-weight: 500; z-index: 5 }
.toast[hidden] { display: none }
.fine { color: var(--mute); font-size: 11px; margin: 26px 0 0 }
.voice-auth { display: flex; justify-content: flex-end; padding-block: 6px }
.voice-auth button { background: transparent; border: 1px solid var(--line); border-radius: 999px; color: var(--foam); padding: 5px 10px; font: 500 13px var(--font); cursor: pointer }
#voice-controls { text-align: center; padding: 0 14px 10px; font: 500 13px var(--font) }
#voice-controls p { margin: 4px 0 }
#voice-controls a, #voice-controls button { color: var(--water); background: var(--foam); border: 0; border-radius: 999px; padding: 6px 12px; font: inherit; cursor: pointer }
#voice-controls [hidden] { display: none }
button:focus-visible, input:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px }
.move-task, #task-move button { color: inherit; background: transparent; border: 1px solid currentColor; border-radius: 8px; padding: 4px 8px; cursor: pointer; font: inherit }
.move-task { font-size: 11px; margin-inline: 6px }
#task-move { max-width: min(320px, 85vw); background: #0b2c36; color: #d9f3ee; border: 1px solid #587376; border-radius: 12px; padding: 18px }
#task-move::backdrop { background: #07161dbb }
#task-move p { margin: 0 0 12px }
#task-move input { display: block; font: inherit; margin: 6px 0 12px }
#task-move button { margin-right: 6px }
#task-move-error { margin-top: 12px }
</style>
</head>
<body>
<div class="phone">
  <div id="pool" role="img" aria-label="Everything the brain remembers, as dumplings: red for urgent, amber for due soon, green for less urgent"><canvas id="c"></canvas></div>
  <div class="voice-auth pad"><button type="button" id="voice-sign-in">Sign in with WorkOS</button></div>
  <div class="seg pad" id="seg"></div>
  <div class="filters pad" id="filters" role="group" aria-label="Filter tasks by category"></div>

    <form id="f"><input id="in" autocomplete="off" placeholder="Type or tap the mic to talk" aria-label="Dump anything"><button type="button" class="mic" id="mic" aria-label="Talk to Dumpling"><svg class="mk" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg><svg class="arrow" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button></form>
  </div>
  <div id="voice-controls" hidden>
    <p id="voice-status" role="status" aria-live="polite"></p>
    <a id="voice-login" target="_blank" rel="noopener noreferrer" hidden>Open WorkOS sign-in</a>
    <button type="button" id="voice-mute" hidden>Mute microphone</button>
    <a id="voice-preview" href="https://elevenlabs.io/app/agents/agents/agent_3401m7q8xy4xevs910n2j7t3w5yf/preview" target="_blank" rel="noopener noreferrer" hidden>Open ElevenLabs Preview</a>
  </div>
  <div class="toast" id="toast" hidden></div>
</div>

<dialog id="task-move" aria-labelledby="task-move-title">
  <p id="task-move-title"></p>
  <form id="task-move-form">
    <label for="task-move-date">New due date</label>
    <input type="date" id="task-move-date" required>
    <button type="submit" id="task-move-save">Save date</button>
    <button type="button" id="task-move-cancel">Cancel</button>
    <div id="task-move-error" role="alert"></div>
  </form>
</dialog>
<script type="module">
import { completionMatches } from '/src/completion.ts'
import { separateDumplings } from '/src/pool-physics.ts'
const reefs = [
  { name: 'Meals', color: '#7be0b0', x: .13, kw: /pasta|dinner|meal|menu|recipe|rice|cook|lunch|snack|soup|cake|groceries/i },
  { name: 'School', color: '#ffd36b', x: .33, kw: /costume|school|teacher|permission|museum/i },
  { name: 'Home', color: '#d8b3a0', x: .43, kw: /home|house|clean|laundry|dentist|doctor|family|garden|repair|washing/i },
  { name: 'Work', color: '#62d6e8', x: .53, kw: /report|client|meeting|safety|invoice|email|supplier|work|office/i },
  { name: 'Gifts', color: '#c3a6ff', x: .71, kw: /gift|birthday|present|toy|puzzle/i },
  { name: 'Bali trip', color: '#8da2ff', x: .89, kw: /bali|villa|flight|passport|hotel|visa|ubud/i },
  { name: 'Loose', color: '#9fb6c8', x: .5, kw: /$^/ },
]
const reef = (n) => reefs.find((r) => r.name === n)
const CATEGORIES = {
  Work: { label: 'Work', color: '#28617f' },
  Home: { label: 'Home', color: '#79505f' },
  Meals: { label: 'Food', color: '#386b55' },
  School: { label: 'Home · School', color: '#79505f' },
  Gifts: { label: 'Home · Gifts', color: '#79505f' },
  'Bali trip': { label: 'Travel', color: '#5c5d91' },
  Loose: { label: 'Personal', color: '#526a75' },
}
const categoryOf = (i) => CATEGORIES[i.reef] || CATEGORIES.Loose
const categoryKey = (i) => categoryOf(i).label.split(' · ')[0]
const categoryNames = ['All', 'Work', 'Home', 'Food', 'Travel', 'Personal']
let selectedCategory = 'All'
const matchesCategory = (i) => selectedCategory === 'All' || categoryKey(i) === selectedCategory
function setCategory(name) {
  selectedCategory = name; selId = null; render(); $('scroll').scrollTop = 0
  $('filters').querySelector(`[data-category="${name}"]`).focus({ preventScroll: true })
}
function categoryTag(i) {
  const category = categoryOf(i), tag = h('button', 'category', category.label)

  tag.addEventListener('click', () => setCategory(categoryKey(i)))
  tag.style.setProperty('--category', category.color)
  return tag
}
let base = new Date(2026, 10, 18) // Wednesday, today in the example
let uid = 1; const now = Date.now()
const exampleItems = [
  { reef: 'Work', short: 'Safety summary', text: 'Send the safety summary to Dad', due: 0 },
  { reef: 'Work', short: 'Supplier reply', text: 'Reply to the equipment supplier', due: 0 },
  { reef: 'Home', short: 'Call dentist', text: 'Call the dentist for Sam’s check-up', due: 0 },
  { reef: 'Meals', short: 'Swap dinner', text: 'Swap Thursday dinner, the school is serving pasta', due: 1, urgent: true, why: 'School has pasta' },
  { reef: 'School', short: 'Costume', text: 'Pick up the costume for Friday’s school event', due: 2, lead: 1, why: 'Needed Friday' },
  { reef: 'Meals', short: 'Kids’ lunchboxes', text: 'Pack the kids’ lunchboxes, no nuts', due: 1, theme: 'Meal prep', who: 'Kids' },
  { reef: 'Meals', short: 'Soup for us', text: 'Defrost the soup for the grown-ups', due: 1, theme: 'Meal prep', who: 'Grown-ups' },
  { reef: 'Meals', short: 'Kids’ snacks', text: 'Sunday prep: snack boxes for the kids', due: 4, theme: 'Meal prep', who: 'Kids' },
  { reef: 'School', short: 'Permission slip', text: 'Sign the museum permission slip', due: 5 },
  { reef: 'Meals', short: 'Sam’s cake', text: 'Order the dinosaur cake for Sam', due: 11, theme: 'Sam’s birthday' },
  { reef: 'Gifts', short: 'Sam’s puzzle', text: 'Order the train puzzle for Sam', due: 12, theme: 'Sam’s birthday' },
  { reef: 'Bali trip', short: 'Villa deposit', text: 'Pay the villa deposit', due: 15 },
  { reef: 'Bali trip', short: 'Passports', text: 'Renew two passports before March', due: 38 },
  { reef: 'Bali trip', short: 'Flight seats', text: 'Book window seats on both flights', due: 70 },
  { reef: 'Bali trip', short: 'Packing list', text: 'Rainy-season packing list', due: 110 },
  { reef: 'Bali trip', short: 'Cooking class', text: 'Confirm six places at the Ubud cooking class', due: 128 },
  { reef: 'School', short: 'School email', text: 'Reply to the school email', due: 0, done: true, doneAt: now - 5 * 36e5 },
  { reef: 'Work', short: 'Invoice', text: 'Approve the supplier invoice', due: 0, done: true, doneAt: now - 4 * 36e5 },
]
let items = exampleItems.map((i) => ({ id: uid++, done: false, ...i }))

// ---------- grouping ----------
const eff = (i) => i.due - (i.lead || 0)
const urgency = (i) => i.urgent || eff(i) <= 0 ? { label: 'Urgent', color: '#c74255' } : eff(i) <= 7 ? { label: 'Due soon', color: '#a76908' } : { label: 'Less urgent', color: '#238367' }
const rank = (i) => (i.urgent ? 50 : 0) - eff(i) // urgent first, then soonest
const openItems = () => items.filter((i) => !i.done)
const isToday = (i) => !i.done && eff(i) <= 0
const isTomorrow = (i) => !i.done && eff(i) === 1
const future = () => openItems().filter((i) => eff(i) >= 2).sort((a, b) => eff(a) - eff(b))
const doneItems = () => items.filter((i) => i.done).sort((a, b) => (b.doneAt || 0) - (a.doneAt || 0))
function entries(list) { // one entry per theme, so kids' and grown-ups' meal prep count once
  const out = [], by = new Map()
  for (const i of list) { if (i.theme && list.filter((x) => x.theme === i.theme).length > 1) { if (!by.has(i.theme)) { const e = { items: [], theme: i.theme }; by.set(i.theme, e); out.push(e) } by.get(i.theme).items.push(i) } else out.push({ items: [i] }) }
  out.forEach((e) => { e.score = Math.max(...e.items.map(rank)) })
  return out.map((e, k) => [e, k]).sort((a, b) => b[0].score - a[0].score || a[1] - b[1]).map((x) => x[0])
}
const fmtDate = (d) => new Date(base.getTime() + d * 864e5).toLocaleDateString([], { weekday: 'short', day: 'numeric', month: 'short' })

// ---------- list ----------
const $ = (id) => document.getElementById(id)
function h(tag, cls, ...kids) { const e = document.createElement(tag); if (cls) e.className = cls; for (const k of kids) if (k != null) e.append(k); return e }
// Five dumplings, one per area of life, all drawn in a 120 by 80 box and shared by the ticks and the pool.
const SHAPES = {

  bao: { body: 'M60 10C96 10 112 32 108 52C104 70 80 72 60 72C40 72 16 70 12 52C8 32 24 10 60 10Z', pleats: 'M60 14C52 20 50 28 54 34M60 14C68 20 70 28 66 34M60 14V34M44 24C46 30 50 34 54 36M76 24C74 30 70 34 66 36', extra: [] },
  xiaolongbao: { body: 'M14 58C8 30 34 22 60 22C86 22 112 30 106 58C104 70 80 72 60 72C40 72 16 70 14 58Z', pleats: 'M60 24L38 32M60 24L48 40M60 24L72 40M60 24L82 32', extra: [{ d: 'M52 20C52 11 68 11 68 20C68 27 52 27 52 20Z', fill: 'body' }] },
  wonton: { body: 'M60 14C78 18 92 34 94 52L112 60L92 70C76 74 44 74 28 70L8 60L26 52C28 34 42 18 60 14Z', pleats: 'M60 16V30M50 20L54 32M70 20L66 32', extra: [] },
  siumai: { body: 'M22 30C22 22 98 22 98 30L96 62C96 74 24 74 24 62Z', pleats: 'M30 40V62M45 42V66M60 42V68M75 42V66M90 40V62', extra: [{ d: 'M22 30C22 38 98 38 98 30C98 22 22 22 22 30Z', fill: '#d9a066' }, { d: 'M56 30a4 4 0 1 0 8 0a4 4 0 1 0-8 0', fill: '#7fbf6a' }] },
}
const SHAPE_OF = { Meals: 'bao', Home: 'wonton', School: 'xiaolongbao', Work: 'gyoza', Gifts: 'wonton', 'Bali trip': 'siumai', Loose: 'gyoza' }
const shapeOf = (i) => SHAPES[SHAPE_OF[i.reef]] || SHAPES.gyoza
const NS = 'http://www.w3.org/2000/svg'
const fresh = new Set()
let tab = 'plan', showDone = false, selId = null
let toastTimer; function toast(msg) { const t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true }, 3400) }
function complete(i) { if (i.done) return; const b = bubbles.find((x) => x.item === i); if (b) fx.push({ x: b.x, y: b.y, c: urgency(i).color, shape: shapeOf(i), tilt: b.tilt, r: isToday(i) || isTomorrow(i) ? 12 : 8, start: performance.now() }); i.done = true; i.doneAt = Date.now(); sync()
  if (window.DumplingBrain?.connected && i.path) window.DumplingBrain.setStatus(i.path, 'done').catch(() => { i.done = false; sync() })
}

function sync() { bubbles = bubbles.filter((b) => !b.item.done); for (const i of items) if (!i.done && !bubbles.some((b) => b.item === i)) spawn(i, true); render() }
function tick(i) { // a small outlined dumpling in the task's own shape: tap it and it gets a bite, a puff of steam, then goes to Eaten
