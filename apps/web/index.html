<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Dumpling: dump anything, and it's filed for you. Tomorrow, at a glance.">
<title>Dumpling</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,500&family=Inter:wght@400;500;600&display=swap">
<style>
[hidden] { display: none !important }
/* Layout: a thin pool on top as the trust layer. Then Today, then Tomorrow. Future is its own tab. Nothing red anywhere: colour only says which part of life it belongs to. Single dark look by choice. */
:root { color-scheme: dark; --water: #07161d; --deep: #0b2c36; --card: #0f2a34; --foam: #d9f3ee; --mute: #86aaaa; --line: rgba(217, 243, 238, .13); --gold: #ffd36b; --font: 'Inter', system-ui, sans-serif; --serif: 'Fraunces', Georgia, serif }
* { box-sizing: border-box }
html, body { height: 100% }
body { margin: 0; background: var(--water); color: var(--foam); font-family: var(--font); overflow: hidden }
.phone { height: 100%; max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; background: linear-gradient(180deg, var(--deep), var(--water) 55%) }
.pad { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
#pool { position: relative; flex: none; height: clamp(150px, 20vh, 200px); margin-top: env(safe-area-inset-top, 0px) }
canvas { position: absolute; inset: 0; width: 100%; height: 100% }
.seg { display: flex; gap: 4px; padding-block: 8px 4px }
.seg button { flex: 1; border: 1px solid var(--line); background: transparent; color: var(--mute); border-radius: 999px; padding: 9px 0; font: 500 14px var(--font); cursor: pointer }
.seg button[aria-pressed=true] { background: var(--foam); color: var(--water); border-color: var(--foam) }
.scroll { flex: 1; min-height: 0; overflow-y: auto; padding-bottom: 24px }
h2 { font: italic 500 32px/1.05 var(--serif); margin: 22px 0 0; display: flex; align-items: baseline; gap: 10px }
h2 small { font: 400 14px var(--font); color: var(--mute) }
.stack { display: flex; flex-direction: column; gap: 10px; margin-top: 14px }
.card { display: flex; align-items: center; gap: 14px; background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 15px 14px 15px 20px; transition: background .2s }
.card.hl, .up.hl { background: #16384a }
.txt { flex: 1; min-width: 0 }
.short { font-size: 20px; font-weight: 600; line-height: 1.15; letter-spacing: -.01em }
.why { margin-top: 3px; font-size: 13px; color: var(--mute) }
.tick { flex: none; width: 62px; height: 42px; border: 0; background: none; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent }
.tick svg { width: 100%; height: 100%; overflow: visible; display: block }
.tick .o { fill: transparent; stroke: var(--c); stroke-width: 5; stroke-linejoin: round; transition: fill .2s }
.tick .x { fill: none; stroke: var(--c); stroke-width: 4 }
.tick .pl { fill: none; stroke: var(--c); stroke-width: 3.5; stroke-linecap: round; opacity: .85 }
.tick:hover .o, .tick:active .o { fill: color-mix(in srgb, var(--c) 30%, transparent) }
.tick .bite { fill: var(--card); transform-box: fill-box; transform-origin: center; transform: scale(0) }
.tick .puff circle { fill: rgba(217, 243, 238, .75); opacity: 0; transform-box: fill-box; transform-origin: center }
.tick.eating { pointer-events: none }
.tick.eating .o { fill: var(--c); stroke: var(--c) }
.tick.eating .x { fill: rgba(255, 255, 255, .35) }
.tick.eating .pl { stroke: rgba(255, 255, 255, .8) }
.tick.eating .bite { animation: bite .3s .1s ease-out forwards }
.tick.eating .puff circle { animation: puff .8s .15s ease-out forwards }
.tick.eating .puff circle:nth-child(2) { animation-delay: .3s } .tick.eating .puff circle:nth-child(3) { animation-delay: .45s }
.eaten { animation: away .45s .55s ease-in forwards }
@keyframes bite { to { transform: scale(1) } }
@keyframes puff { 0% { opacity: .85; transform: translateY(0) scale(.6) } 100% { opacity: 0; transform: translateY(-28px) scale(1.5) } }
@keyframes away { to { opacity: 0; transform: translateX(26px) scale(.96) } }
.card.fresh { animation: wobble .7s ease }
@keyframes wobble { 0% { transform: scale(.9) rotate(-2deg); opacity: 0 } 40% { transform: scale(1.03) rotate(1.5deg); opacity: 1 } 70% { transform: rotate(-1deg) } 100% { transform: none } }
@media (prefers-reduced-motion: reduce) { .tick.eating .bite, .tick.eating .puff circle, .eaten, .card.fresh { animation: none } .tick.eating .bite { transform: scale(1) } .eaten { opacity: 0 } }
.group { flex-direction: column; align-items: stretch; gap: 2px; background: radial-gradient(120% 140% at 0% 0%, color-mix(in srgb, var(--c) 24%, transparent), transparent 65%), var(--card) }
.gh { padding-bottom: 6px; font: italic 500 17px var(--serif) }
.sub-row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line) }
.who { font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: #06141a; background: var(--c); border-radius: 999px; padding: 2px 8px; flex: none }
.sub-row .short { font-size: 17px }
.empty { color: var(--mute); font-size: 16px; margin: 14px 0 0 }
.up { display: flex; align-items: center; gap: 12px; padding: 13px 8px; border-bottom: 1px solid var(--line); border-radius: 10px; font-size: 16px }
.up i { width: 10px; height: 10px; border-radius: 50%; background: var(--c); flex: none }
.up .n { flex: 1; min-width: 0 }
.up .d { color: var(--mute); font-size: 13px; font-variant-numeric: tabular-nums }
.label { font-size: 12px; font-weight: 500; letter-spacing: .1em; text-transform: uppercase; color: var(--mute); margin: 26px 0 4px }
.donebtn { display: flex; justify-content: space-between; width: 100%; background: none; border: 0; color: var(--mute); font: 500 13px var(--font); padding: 0; margin-top: 30px; cursor: pointer }
.done-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; color: var(--mute); font-size: 15px }
.done-row span { flex: 1; text-decoration: line-through }
.link { background: transparent; border: 0; color: var(--mute); font: 500 12px var(--font); text-decoration: underline; cursor: pointer; padding: 4px 0 }
.bar { flex: none; padding-top: 10px; padding-bottom: max(12px, env(safe-area-inset-bottom, 0px)); background: rgba(7, 22, 29, .96); border-top: 1px solid var(--line) }
.bar form { display: flex; gap: 8px; align-items: center; background: #0d2b36; border: 1px solid var(--line); border-radius: 999px; padding: 6px 6px 6px 18px }
.bar input { flex: 1; min-width: 0; background: transparent; border: 0; color: var(--foam); font: 16px var(--font); outline: none; padding: 8px 0 }
.bar input::placeholder { color: var(--mute) }
.mic { flex: none; width: 48px; height: 48px; border-radius: 50%; border: 0; background: var(--foam); color: var(--water); display: grid; place-items: center; cursor: pointer }
.mic svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round }
/* A slow, soft yellow glow: the mic is the main way in. */
.mic { box-shadow: 0 0 0 1px rgba(255, 211, 107, .35), 0 0 14px rgba(255, 211, 107, .28), 0 0 32px rgba(255, 211, 107, .14); animation: glow 3.6s ease-in-out infinite }
@keyframes glow { 50% { box-shadow: 0 0 0 1px rgba(255, 211, 107, .5), 0 0 20px rgba(255, 211, 107, .42), 0 0 42px rgba(255, 211, 107, .22) } }
.mic .arrow { display: none }
.mic.send .arrow { display: block }
.mic.send .mk { display: none }
.mic.send { animation: none; box-shadow: none }
.mic.listening { background: var(--gold); animation: listen 1.1s ease-in-out infinite }
@keyframes listen { 0%, 100% { box-shadow: 0 0 0 0 rgba(255, 211, 107, .55) } 50% { box-shadow: 0 0 0 14px rgba(255, 211, 107, 0) } }
@media (prefers-reduced-motion: reduce) { .mic, .mic.listening { animation: none } }
.toast { position: fixed; left: 16px; right: 16px; bottom: calc(90px + env(safe-area-inset-bottom, 0px)); max-width: 488px; margin: 0 auto; background: var(--foam); color: var(--water); border-radius: 14px; padding: 12px 14px; font-size: 14px; font-weight: 500; z-index: 5 }
.toast[hidden] { display: none }
.fine { color: var(--mute); font-size: 11px; margin: 26px 0 0 }
button:focus-visible, input:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px }
</style>
</head>
<body>
<div class="phone">
  <div id="pool" role="img" aria-label="Everything the brain remembers, as colour-coded dumplings"><canvas id="c"></canvas></div>
  <div class="seg pad" id="seg"></div>
  <div class="scroll pad" id="scroll">
    <div id="plan">
      <h2>Today <small id="d0"></small></h2><div class="stack" id="today"></div>
      <h2>Tomorrow <small id="d1"></small></h2><div class="stack" id="tomorrow"></div>
      <button class="donebtn" id="donelabel"></button><div id="donelist"></div>
    </div>
    <div id="future" hidden></div>
    <p class="fine">Example data, made up for the Day 13 mind dump.</p>
  </div>
  <div class="bar pad">
    <form id="f"><input id="in" autocomplete="off" placeholder="Type or open Dumpling voice" aria-label="Dump anything"><button type="button" class="mic" id="mic" aria-label="Tap to talk"><svg class="mk" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg><svg class="arrow" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button></form>
  </div>
  <div class="toast" id="toast" hidden></div>
</div>

<script>
const reefs = [
  { name: 'Meals', color: '#7be0b0', x: .13, kw: /pasta|dinner|meal|menu|recipe|rice|cook|lunch|snack|soup|cake|groceries/i },
  { name: 'School', color: '#ffd36b', x: .33, kw: /costume|school|teacher|permission|museum/i },
  { name: 'Work', color: '#62d6e8', x: .53, kw: /report|client|meeting|safety|invoice|email|supplier|dentist|call/i },
  { name: 'Gifts', color: '#c3a6ff', x: .71, kw: /gift|birthday|present|toy|puzzle/i },
  { name: 'Bali trip', color: '#8da2ff', x: .89, kw: /bali|villa|flight|passport|hotel|visa|ubud/i },
  { name: 'Loose', color: '#9fb6c8', x: .5, kw: /$^/ },
]
const reef = (n) => reefs.find((r) => r.name === n)
const base = new Date(2026, 10, 18) // Wednesday, today in the example
let uid = 1; const now = Date.now()
let items = [
  { reef: 'Work', short: 'Safety summary', text: 'Send the safety summary to Dad', due: 0 },
  { reef: 'Work', short: 'Supplier reply', text: 'Reply to the equipment supplier', due: 0 },
  { reef: 'Work', short: 'Call dentist', text: 'Call the dentist for Sam’s check-up', due: 0 },
  { reef: 'Meals', short: 'Swap dinner', text: 'Swap Thursday dinner, the school is serving pasta', due: 1, urgent: true, why: 'School has pasta' },
  { reef: 'School', short: 'Costume', text: 'Pick up the costume for Friday’s school event', due: 2, lead: 1, why: 'Needed Friday' },
  { reef: 'Meals', short: 'Kids’ lunchboxes', text: 'Pack the kids’ lunchboxes, no nuts', due: 1, theme: 'Meal prep', who: 'Kids' },
  { reef: 'Meals', short: 'Soup for us', text: 'Defrost the soup for the grown-ups', due: 1, theme: 'Meal prep', who: 'Grown-ups' },
  { reef: 'Meals', short: 'Kids’ snacks', text: 'Sunday prep: snack boxes for the kids', due: 4, theme: 'Meal prep', who: 'Kids' },
  { reef: 'School', short: 'Permission slip', text: 'Sign the museum permission slip', due: 5 },
  { reef: 'Meals', short: 'Sam’s cake', text: 'Order the dinosaur cake for Sam', due: 11, theme: 'Sam’s birthday' },
  { reef: 'Gifts', short: 'Sam’s puzzle', text: 'Order the train puzzle for Sam', due: 12, theme: 'Sam’s birthday' },
  { reef: 'Bali trip', short: 'Villa deposit', text: 'Pay the villa deposit', due: 15 },
  { reef: 'Bali trip', short: 'Passports', text: 'Renew two passports before March', due: 38 },
  { reef: 'Bali trip', short: 'Flight seats', text: 'Book window seats on both flights', due: 70 },
  { reef: 'Bali trip', short: 'Packing list', text: 'Rainy-season packing list', due: 110 },
  { reef: 'Bali trip', short: 'Cooking class', text: 'Confirm six places at the Ubud cooking class', due: 128 },
  { reef: 'School', short: 'School email', text: 'Reply to the school email', due: 0, done: true, doneAt: now - 5 * 36e5 },
  { reef: 'Work', short: 'Invoice', text: 'Approve the supplier invoice', due: 0, done: true, doneAt: now - 4 * 36e5 },
].map((i) => ({ id: uid++, done: false, ...i }))

// ---------- grouping ----------
const eff = (i) => i.due - (i.lead || 0)
const rank = (i) => (i.urgent ? 50 : 0) - eff(i) // urgent first, then soonest
const openItems = () => items.filter((i) => !i.done)
const isToday = (i) => !i.done && eff(i) <= 0
const isTomorrow = (i) => !i.done && eff(i) === 1
const future = () => openItems().filter((i) => eff(i) >= 2).sort((a, b) => eff(a) - eff(b))
const doneItems = () => items.filter((i) => i.done).sort((a, b) => b.doneAt - a.doneAt)
function entries(list) { // one entry per theme, so kids' and grown-ups' meal prep count once
  const out = [], by = new Map()
  for (const i of list) { if (i.theme && list.filter((x) => x.theme === i.theme).length > 1) { if (!by.has(i.theme)) { const e = { items: [], theme: i.theme }; by.set(i.theme, e); out.push(e) } by.get(i.theme).items.push(i) } else out.push({ items: [i] }) }
  out.forEach((e) => { e.score = Math.max(...e.items.map(rank)) })
  return out.map((e, k) => [e, k]).sort((a, b) => b[0].score - a[0].score || a[1] - b[1]).map((x) => x[0])
}
const fmtDate = (d) => new Date(base.getTime() + d * 864e5).toLocaleDateString([], { weekday: 'short', day: 'numeric', month: 'short' })

// ---------- list ----------
const $ = (id) => document.getElementById(id)
function h(tag, cls, ...kids) { const e = document.createElement(tag); if (cls) e.className = cls; for (const k of kids) if (k != null) e.append(k); return e }
// Five dumplings, one per area of life, all drawn in a 120 by 80 box and shared by the ticks and the pool.
const SHAPES = {
  gyoza: { body: 'M8 52C6 14 114 14 112 52C98 68 22 68 8 52Z', pleats: 'M30 35l5 12M45 29l3 13M60 26v14M75 29l-3 13M90 35l-5 12', extra: [] },
  bao: { body: 'M60 10C96 10 112 32 108 52C104 70 80 72 60 72C40 72 16 70 12 52C8 32 24 10 60 10Z', pleats: 'M60 14C52 20 50 28 54 34M60 14C68 20 70 28 66 34M60 14V34M44 24C46 30 50 34 54 36M76 24C74 30 70 34 66 36', extra: [] },
  xiaolongbao: { body: 'M14 58C8 30 34 22 60 22C86 22 112 30 106 58C104 70 80 72 60 72C40 72 16 70 14 58Z', pleats: 'M60 24L38 32M60 24L48 40M60 24L72 40M60 24L82 32', extra: [{ d: 'M52 20C52 11 68 11 68 20C68 27 52 27 52 20Z', fill: 'body' }] },
  wonton: { body: 'M60 14C78 18 92 34 94 52L112 60L92 70C76 74 44 74 28 70L8 60L26 52C28 34 42 18 60 14Z', pleats: 'M60 16V30M50 20L54 32M70 20L66 32', extra: [] },
  siumai: { body: 'M22 30C22 22 98 22 98 30L96 62C96 74 24 74 24 62Z', pleats: 'M30 40V62M45 42V66M60 42V68M75 42V66M90 40V62', extra: [{ d: 'M22 30C22 38 98 38 98 30C98 22 22 22 22 30Z', fill: '#d9a066' }, { d: 'M56 30a4 4 0 1 0 8 0a4 4 0 1 0-8 0', fill: '#7fbf6a' }] },
}
const SHAPE_OF = { Meals: 'bao', School: 'xiaolongbao', Work: 'gyoza', Gifts: 'wonton', 'Bali trip': 'siumai', Loose: 'gyoza' }
const shapeOf = (i) => SHAPES[SHAPE_OF[i.reef]] || SHAPES.gyoza
const NS = 'http://www.w3.org/2000/svg'
const fresh = new Set()
let tab = 'plan', showDone = false, selId = null
let toastTimer; function toast(msg) { const t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true }, 3400) }
function complete(i) { const b = bubbles.find((x) => x.item === i); if (b) fx.push({ x: b.x, y: b.y, c: reef(i.reef).color, t: 0 }); i.done = true; i.doneAt = Date.now(); sync() }
function sync() { bubbles = bubbles.filter((b) => !b.item.done); for (const i of items) if (!i.done && !bubbles.some((b) => b.item === i)) spawn(i, true); render() }
function tick(i) { // a small outlined dumpling in the task's own shape: tap it and it gets a bite, a puff of steam, then goes to Eaten
  const sh = shapeOf(i), b = h('button', 'tick'); b.setAttribute('aria-label', 'Done: ' + i.short)
  const svg = document.createElementNS(NS, 'svg'); svg.setAttribute('viewBox', '0 0 120 80'); svg.setAttribute('aria-hidden', 'true')
  svg.innerHTML = `<path class="o" d="${sh.body}"/>` + sh.extra.map((x) => `<path class="x" d="${x.d}"/>`).join('') + `<path class="pl" d="${sh.pleats}"/><circle class="bite" cx="104" cy="22" r="28"/><g class="puff"><circle cx="34" cy="22" r="5"/><circle cx="60" cy="14" r="6"/><circle cx="86" cy="22" r="5"/></g>`
  b.append(svg)
  b.addEventListener('click', () => { b.classList.add('eating'); const r = b.closest('.card, .sub-row'); if (r) r.classList.add('eaten'); setTimeout(() => complete(i), reduce ? 0 : 950) })
  return b
}
function row(i) { const c = h('div', 'card' + (fresh.has(i.id) ? ' fresh' : '')); c.dataset.id = i.id; c.style.setProperty('--c', reef(i.reef).color); const t = h('div', 'txt', h('div', 'short', i.short)); if (i.why) t.append(h('div', 'why', i.why)); c.append(t, tick(i)); return c }
function groupCard(e) {
  const same = e.items.every((x) => x.reef === e.items[0].reef), c = h('div', 'card group'); c.style.setProperty('--c', same ? reef(e.items[0].reef).color : '#d9f3ee')
  c.append(h('div', 'gh', e.theme))
  for (const i of e.items) { const r = h('div', 'sub-row'); r.dataset.id = i.id; r.style.setProperty('--c', reef(i.reef).color); if (i.who) r.append(h('span', 'who', i.who)); r.append(h('div', 'txt', h('div', 'short', i.short)), tick(i)); c.append(r) }
  return c
}
function fill(el, list, emptyText) { el.replaceChildren(); const es = entries(list); es.forEach((e) => el.append(e.items.length > 1 ? groupCard(e) : row(e.items[0]))); if (!es.length) el.append(h('p', 'empty', emptyText)) }
function render() {
  const seg = $('seg'); seg.replaceChildren()
  for (const [id, label] of [['plan', 'Today & tomorrow'], ['future', 'Future']]) { const b = h('button', null, label); b.setAttribute('aria-pressed', String(tab === id)); b.addEventListener('click', () => { tab = id; render() }); seg.append(b) }
  $('plan').hidden = tab !== 'plan'; $('future').hidden = tab !== 'future'
  const day = (n) => new Date(base.getTime() + n * 864e5).toLocaleDateString([], { weekday: 'long', day: 'numeric', month: 'short' })
  $('d0').textContent = day(0); $('d1').textContent = day(1)
  fill($('today'), items.filter(isToday), 'All eaten. Today is clear.')
  fill($('tomorrow'), items.filter(isTomorrow), 'Nothing planned. Enjoy it.')
  const D = doneItems(), dl = $('donelabel'); dl.textContent = ''; dl.append(h('span', null, `Eaten · ${D.length}`), h('span', null, D.length ? (showDone ? 'Hide' : 'Show') : '')); dl.onclick = () => { showDone = !showDone; render() }
  const dv = $('donelist'); dv.replaceChildren()
  if (showDone) for (const i of D) { const r = h('div', 'done-row', h('span', null, i.short)); const b = h('button', 'link', 'Put back'); b.addEventListener('click', () => { i.done = false; sync() }); r.append(b); dv.append(r) }
  const fv = $('future'); fv.replaceChildren()
  const groups = [['This week', (i) => eff(i) <= 7], ['This month', (i) => eff(i) > 7 && eff(i) <= 31], ['Later', (i) => eff(i) > 31]]
  for (const [name, test] of groups) { const L = future().filter(test); if (!L.length) continue; fv.append(h('div', 'label', name)); for (const i of L) { const r = h('div', 'up'); r.dataset.id = i.id; r.style.setProperty('--c', reef(i.reef).color); r.append(h('i'), h('span', 'n', i.short), h('span', 'd', fmtDate(i.due))); fv.append(r) } }
  if (!future().length) fv.append(h('p', 'empty', 'Nothing coming up.'))
}

// ---------- the pool: a thin trust layer ----------
// A little pleated dumpling, tinted by area of life. r is its half-height scale; tilt gives each one its own lean.
function tint(hex, t) { const n = parseInt(hex.slice(1), 16), c = [n >> 16, (n >> 8) & 255, n & 255].map((v) => Math.round(v + (255 - v) * t)); return `rgb(${c})` }
const P2 = new Map(); const path2 = (d) => { if (!P2.has(d)) P2.set(d, new Path2D(d)); return P2.get(d) }
function dumpling(ctx, x, y, r, tilt, color, alpha, ring, sh) {
  const k = r / 50; ctx.save(); ctx.translate(x, y); ctx.rotate(tilt); ctx.scale(k, k); ctx.translate(-60, -42); ctx.globalAlpha = alpha
  const g = ctx.createLinearGradient(0, 10, 0, 74); g.addColorStop(0, tint(color, .55)); g.addColorStop(.45, color); g.addColorStop(1, color)
  const body = path2(sh.body); ctx.fillStyle = g; ctx.fill(body); ctx.lineWidth = 1.4 / k; ctx.strokeStyle = 'rgba(7,22,29,.35)'; ctx.stroke(body)
  for (const x2 of sh.extra) { ctx.fillStyle = x2.fill === 'body' ? g : x2.fill; ctx.fill(path2(x2.d)); ctx.stroke(path2(x2.d)) }
  ctx.strokeStyle = 'rgba(255,255,255,.65)'; ctx.lineWidth = Math.max(2.4, 1.1 / k); ctx.lineCap = 'round'; ctx.stroke(path2(sh.pleats))
  if (ring) { ctx.globalAlpha = 1; ctx.strokeStyle = '#d9f3ee'; ctx.lineWidth = 2 / k; ctx.stroke(body) }
  ctx.restore()
}
function steam(ctx, x, y, t, ph) { // a faint wisp over today's dumplings
  for (let n = 0; n < 2; n++) { const p = (t * .45 + n * .5 + ph) % 1, sx = x + (n ? 4 : -4), sy = y - p * 12; ctx.beginPath(); ctx.moveTo(sx, sy); ctx.bezierCurveTo(sx + 3, sy - 3, sx - 3, sy - 6, sx, sy - 9); ctx.strokeStyle = `rgba(217,243,238,${.45 * (1 - p)})`; ctx.lineWidth = 1.2; ctx.lineCap = 'round'; ctx.stroke() }
}
const cv = $('c'), ctx = cv.getContext('2d'), pool = $('pool')
let W = 1, H = 1, dpr = 1, bubbles = [], fx = [], t0 = performance.now()
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches
function size() { dpr = devicePixelRatio || 1; W = pool.clientWidth; H = pool.clientHeight; cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0) }
new ResizeObserver(size).observe(pool); size()
const anchor = (r) => ({ x: r.x * W, y: H * .5 })
function spawn(item, fromTop) { const r = reef(item.reef), a = anchor(r); bubbles.push({ item, x: fromTop ? W / 2 : a.x + (Math.random() - .5) * 40, y: fromTop ? -10 : a.y + (Math.random() - .5) * 40, vx: 0, vy: 0, ph: Math.random() * 6.28, tilt: (Math.random() - .5) * .5, born: fromTop ? performance.now() : 0, w: 24, h: 18 }) }
items.filter((i) => !i.done).forEach((i) => spawn(i, false))
function frame(tn) {
  requestAnimationFrame(frame)
  const t = (tn - t0) / 1000, sx = Math.min(1.2, W / 390); ctx.clearRect(0, 0, W, H)
  const near = (i) => isToday(i) || isTomorrow(i) // these get a name; the rest are just remembered
  for (const r of reefs) { if (!items.some((i) => !i.done && i.reef === r.name)) continue; const a = anchor(r), g = ctx.createRadialGradient(a.x, a.y, 0, a.x, a.y, 60 * sx); g.addColorStop(0, r.color + '2a'); g.addColorStop(1, r.color + '00'); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(a.x, a.y, 60 * sx, 0, 6.3); ctx.fill() }
  for (const b of bubbles) { ctx.font = '600 10px Inter, system-ui, sans-serif'; b.w = near(b.item) ? Math.max(40, ctx.measureText(b.item.short).width + 10) : 26; b.h = near(b.item) ? 48 : 20 }
  const themes = new Map(); for (const b of bubbles) if (b.item.theme) { if (!themes.has(b.item.theme)) themes.set(b.item.theme, []); themes.get(b.item.theme).push(b) }
  if (!reduce) {
    for (const g of themes.values()) if (g.length > 1) { const cx = g.reduce((a, b) => a + b.x, 0) / g.length, cy = g.reduce((a, b) => a + b.y, 0) / g.length; for (const b of g) { b.vx += (cx - b.x) * .003; b.vy += (cy - b.y) * .003 } }
    for (let a = 0; a < bubbles.length; a++) for (let c = a + 1; c < bubbles.length; c++) { const A = bubbles[a], B = bubbles[c], dx = B.x - A.x, dy = B.y - A.y, ox = (A.w + B.w) / 2 - Math.abs(dx), oy = (A.h + B.h) / 2 - Math.abs(dy)
      if (ox > 0 && oy > 0) { if (ox < oy) { const f = Math.sign(dx || 1) * ox * .09; A.vx -= f; B.vx += f } else { const f = Math.sign(dy || 1) * oy * .09; A.vy -= f; B.vy += f } } }
  }
  for (const [, g] of themes) { if (g.length < 2) continue // a soft halo for things that belong together
    const cx = g.reduce((a, b) => a + b.x, 0) / g.length, cy = g.reduce((a, b) => a + b.y, 0) / g.length, rad = Math.max(...g.map((b) => Math.hypot(b.x - cx, b.y - cy))) + 30
    const same = g.every((b) => b.item.reef === g[0].item.reef), col = same ? reef(g[0].item.reef).color : '#d9f3ee'
    const gr = ctx.createRadialGradient(cx, cy, rad * .15, cx, cy, rad); gr.addColorStop(0, col + '30'); gr.addColorStop(.75, col + '1a'); gr.addColorStop(1, col + '00'); ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(cx, cy, rad, 0, 6.3); ctx.fill() }
  for (const b of bubbles) {
    const i = b.item, r = reef(i.reef), a = anchor(r), n = near(i), far = Math.min(1, eff(i) / 60)
    const tx = a.x + Math.cos(t * .3 + b.ph) * 34 * sx, ty = a.y + Math.sin(t * .4 + b.ph * 1.3) * 22 + far * 10
    if (!reduce) { b.vx = (b.vx + (tx - b.x) * .006) * .92; b.vy = (b.vy + (ty - b.y) * .006) * .92; b.x += b.vx; b.y += b.vy } else { b.x = tx; b.y = ty }
    b.x = Math.max(b.w / 2 + 4, Math.min(W - b.w / 2 - 4, b.x)); b.y = Math.max(14, Math.min(H - 22, b.y))
    const hl = i.id === selId, rad = (n ? 12 : 6.5 + (1 - far) * 2.5) * (hl ? 1.25 : 1)
    const wob = b.born && !reduce ? Math.sin((tn - b.born) / 70) * .5 * Math.max(0, 1 - (tn - b.born) / 1600) : 0 // new ones wobble as they land
    dumpling(ctx, b.x, b.y, rad, b.tilt + wob, r.color, n ? 1 : .85 - far * .3, hl, shapeOf(i))
    if (isToday(i) && !reduce) steam(ctx, b.x, b.y - rad * .9, t, b.ph)
    if (n || hl) { ctx.font = '600 10px Inter, system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.lineWidth = 3; ctx.lineJoin = 'round'; ctx.strokeStyle = 'rgba(7,22,29,.9)'; ctx.strokeText(i.short, b.x, b.y + rad + 12); ctx.fillStyle = hl ? '#fff' : '#d9f3ee'; ctx.fillText(i.short, b.x, b.y + rad + 12) }
  }
  fx = fx.filter((f) => (f.t += .025) < 1); for (const f of fx) { ctx.beginPath(); ctx.arc(f.x, f.y - f.t * 20, 6 + f.t * 26, 0, 6.3); ctx.strokeStyle = f.c; ctx.globalAlpha = 1 - f.t; ctx.lineWidth = 2; ctx.stroke(); ctx.globalAlpha = 1 }
}
requestAnimationFrame(frame)
cv.addEventListener('pointerdown', (e) => {
  const rc = cv.getBoundingClientRect(), x = e.clientX - rc.left, y = e.clientY - rc.top; let best = null, d = 26
  for (const b of bubbles) { const k = Math.hypot(b.x - x, b.y - y); if (k < d) { d = k; best = b } }
  selId = best ? best.item.id : null; if (!best) return
  tab = eff(best.item) >= 2 ? 'future' : 'plan'; render()
  const el = document.querySelector(`[data-id="${selId}"]`); if (el) { el.scrollIntoView({ block: 'center', behavior: reduce ? 'auto' : 'smooth' }); el.classList.add('hl'); setTimeout(() => el.classList.remove('hl'), 1400) }
})

// ---------- dumping ----------
const filler = new Set('a an the to for of and or with at on in my me i we need needs have has must should remember dont forget please tomorrow today tonight urgent asap now get do make send is are was be it this that some about before after by up out from really just also then wants want'.split(' '))
function shorten(text) { const w = text.replace(/\bin \d+ (day|week|month)s?\b/ig, '').replace(/[^\w' -]/g, ' ').split(/\s+/).filter((x) => x && !filler.has(x.toLowerCase())); const o = w.slice(0, 2).join(' ') || text.slice(0, 14); return o.charAt(0).toUpperCase() + o.slice(1) }
function drop(text) {
  const made = []
  for (const p of text.split(/[.\n;]+/).map((x) => x.trim()).filter(Boolean)) {
    const r = reefs.find((x) => x.kw.test(p)) || reef('Loose'); let due = 7; const m = p.match(/in (\d+) (day|week|month)s?/i)
    if (m) due = +m[1] * ({ day: 1, week: 7, month: 30 })[m[2].toLowerCase()]; else if (/today|tonight|asap|now/i.test(p)) due = 0; else if (/tomorrow|tmrw|urgent/i.test(p)) due = 1; else if (r.name === 'Work') due = 3
    const it = { id: uid++, reef: r.name, short: shorten(p), text: p, due, urgent: /urgent|asap/i.test(p), done: false }; items.push(it); made.push(it)
  }
  if (!made.length) return; made.forEach((m) => fresh.add(m.id)); sync(); fresh.clear(); toast(`Filed ${made.length}: ` + made.map((i) => `${i.short} → ${isToday(i) ? 'Today' : isTomorrow(i) ? 'Tomorrow' : 'Future'}`).join(', '))
}
$('f').addEventListener('submit', (e) => { e.preventDefault(); const v = $('in').value; if (v.trim()) { drop(v); $('in').value = ''; syncMic() } })
// An empty composer opens the private voice preview. Typed text still files through the prototype.
const VOICE_PREVIEW = 'https://elevenlabs.io/app/agents/agents/agent_3401m7q8xy4xevs910n2j7t3w5yf/preview'
function syncMic() {
  const hasText = $('in').value.trim().length > 0
  $('mic').classList.toggle('send', hasText)
  $('mic').setAttribute('aria-label', hasText ? 'File it' : 'Open Dumpling voice in ElevenLabs')
}
$('in').addEventListener('input', syncMic)
$('mic').addEventListener('click', () => {
  if ($('in').value.trim()) {
    $('f').requestSubmit()
    return
  }
  window.open(VOICE_PREVIEW, '_blank', 'noopener,noreferrer')
})
syncMic()
render()
</script>
